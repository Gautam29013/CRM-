services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nexus-mongo:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  api:
    build: ./server
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nexuscrm
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
volumes:
  nexus-mongo:
